# render.yaml - Blueprint para deploy automático no Render
services:
  # Frontend - Site Estático (100% Gratuito)
  - type: web
    name: curriculinho-2.0
    runtime: static
    plan: free
    buildCommand: echo "Static site, no build needed"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend - FastAPI API (100% Gratuito)
  - type: web
    name: curriculinho-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
